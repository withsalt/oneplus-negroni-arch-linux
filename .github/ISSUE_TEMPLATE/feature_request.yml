name: 功能或文档建议
description: 提出改进需求、使用场景或文档建议
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 说明使用场景和当前遇到的限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可附替代方案、上游链接或已有验证结果。
    validations:
      required: true
